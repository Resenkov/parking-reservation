spring.application.name=parking-account-service

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.datasource.url=jdbc:postgresql://localhost:5558/postgres
spring.datasource.username=postgres
spring.datasource.password=2611

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=parking-account-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=resenkov.work.parkingreservationservice.dto,ru.dstu.work.parkingaccountservice.dto
spring.kafka.consumer.properties.spring.json.value.default.type=ru.dstu.work.parkingaccountservice.dto.ReservationBillingEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

logging.level.ru.dstu.work.parkingaccountservice=DEBUG
logging.level.org.springframework.web=DEBUG
